name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev libffi-dev liblldb-dev
          pip install --upgrade pip
          pip install buildozer "cython<3.0.0"

      - name: Configure buildozer.spec if missing
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
            sed -i 's/title = My Application/title = Kivy Memory App/' buildozer.spec
            sed -i 's/package.name = myapp/package.name = kivymemoryapp/' buildozer.spec
            sed -i 's/package.domain = org.test/package.domain = org.test/' buildozer.spec
            sed -i 's/requirements = python3,kivy/requirements = python3,kivy,sqlite3/' buildozer.spec
          fi

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivymemoryapp-apk
          path: bin/*.apk
