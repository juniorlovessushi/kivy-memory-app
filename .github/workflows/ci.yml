name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Test SQLite Database Logic
      run: |
        python -c "import database; database.init_db(); database.save_timestamp('CI Test Entry'); print('Database check passed:', database.get_last_timestamp())"
